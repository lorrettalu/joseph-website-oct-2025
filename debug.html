<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugger</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/addons/p5.sound.min.js"></script>
</head>
<body>
    <h1>Minigame 2: Picture Game</h1>

    <div style="margin-bottom:8px;">
        <strong id="g2-level">Level 1 of 29</strong>
    </div>

    <div id="game2-canvas" style="margin: 0 auto;"></div>

    <form id="g2-form" style="margin-top:14px;">
        <input id="g2-input" type="text" placeholder="Type your guess…" autocomplete="off" style="padding:8px 10px; border-radius:8px; border:2px solid #a8c5a0; width:50%;">
        <button id="g2-submit" type="submit" class="nav-button" style="margin-left:8px;">Submit</button>
    </form>

    <div style="height:22px; margin-top:6px;">
        <small id="g2-feedback" style="color:#b64646; visibility:hidden;">Incorrect, try again.</small>
    </div>

    <div id="g2-success" style="display:none; margin-top:10px; font-weight:700; color:#4b5a43;">
        Good job! 🎉
    </div>

    <button id="g2-next" class="nav-button" style="display:none; margin-top:10px;">
        Next level ➜
    </button>
    
    <script src="game2/picture.js"></script>
</body>
</html>
